<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<style>
#sidebar {
    position: fixed;
    top: 0;
    right: -420px;
    width: 420px;
    height: 100%;
    background: white;
    border-left: 3px solid #444;
    overflow-y: auto;
    transition: right 0.3s ease;
    z-index: 999999;
    font-family: Arial, sans-serif;
}
#sidebar.open { right: 0; }
#sidebar-close {
    cursor: pointer;
    font-size: 28px;
    font-weight: bold;
    float: right;
    margin: 15px;
    padding: 10px 20px;
}
.tab-container { margin-top: 65px; }
.tab-buttons { display: flex; border-bottom: 2px solid #ccc; }
.tab-buttons button {
    flex: 1; padding: 18px; background: #eee;
    border: none; cursor: pointer; font-weight: bold;
    font-size: 16px;
}
.tab-buttons button.active {
    background: #ddd; border-bottom: 3px solid #444;
}
.tab-content { display: none; padding: 15px; }
.tab-content.active { display: block; }
#sidebar img { width: 100%; border-radius: 6px; margin-bottom: 10px; }

#page-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(255, 255, 255, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 0;
    font-family: Arial, sans-serif;
    z-index: 9999;
    border-bottom: 2px solid #444;
}
#page-header img {
    height: 35px;
    margin-right: 10px;
}
#header-title {
    font-size: 20px;
    font-weight: bold;
}

/* Mobile Specific Overrides */
@media only screen and (max-width: 600px) {
    #sidebar {
        width: 90% !important;
        right: -90%;
    }
    #header-title {
        font-size: 16px;
    }
    #search-container, #needs-foster-panel {
        width: 180px !important;
    }
    .foster-item {
        padding: 15px !important; /* Larger touch target */
    }
}
</style>

<div id="page-header">
    <img src="https://s3.amazonaws.com/imagesroot.rescuegroups.org/webpages/s8319n8fohztfmoo.jpg" alt="UDR Logo">
    <div id="header-title">UDR Foster Map</div>
</div>

<div id="sidebar">
    <span id="sidebar-close">✕</span>

    <div class="tab-container">
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="openTab('details')">Details</button>
            <button class="tab-btn" onclick="openTab('links')">Links</button>
        </div>

        <div id="details" class="tab-content active">
            <div id="photos"></div>
            <div id="videos"></div>
            <div id="info-text"></div>
        </div>
        <div id="links" class="tab-content"></div>
    </div>
</div>

<script>
document.getElementById("sidebar-close").onclick = function() {
    document.getElementById("sidebar").classList.remove("open");
};

function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
}

function openTab(tabName) {
    var tabs = document.getElementsByClassName("tab-content");
    var buttons = document.getElementsByClassName("tab-btn");

    for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.remove("active");
        buttons[i].classList.remove("active");
    }

    document.getElementById(tabName).classList.add("active");
    if(tabName === 'details') buttons[0].classList.add("active");
    else buttons[1].classList.add("active");
}
</script>

<div id="search-container"><input type="text" id="dog-search" placeholder="Search dogs by name..." oninput="filterDogs()"></div>
    
<script>
    function filterDogs() {
        var searchTerm = document.getElementById('dog-search').value.toLowerCase();
        var map = null;
        var markerCluster = null;

        // Find the map and cluster objects globally
        for (var key in window) {
            if (window[key] instanceof L.Map) {
                map = window[key];
            }
            if (window[key] instanceof L.MarkerClusterGroup) {
                markerCluster = window[key];
            }
        }

        if (!map || !markerCluster) {
            console.warn("Map or MarkerCluster not found for filtering.");
            return;
        }

        // Clear existing markers from the cluster
        markerCluster.clearLayers();

        window.markerData.forEach(function(dog) {
            // The 'name' property is now available in `window.markerData`
            // Also lat, lon, iconColor are available.
            if (dog.name.toLowerCase().includes(searchTerm)) {
                // Recreate marker and add to cluster
                var marker = L.marker([dog.lat, dog.lon], {
                    icon: L.AwesomeMarkers.icon({
                        icon: 'paw',
                        prefix: 'fa',
                        markerColor: dog.iconColor // Use the stored color
                    }),
                    // Set tooltip (name) and animalId for event binding
                    title: dog.name,
                    animalId: dog.id
                });
                markerCluster.addLayer(marker);

                // Re-bind click event for the newly created marker
                marker.on('click', function(e) {
                    var dogId = e.target.options.animalId;
                    var data = window.markerData.find(d => String(d.id) === String(dogId));
                    if (data) window.updateSidebar(data);
                });
            }
        });

        // Note: Filtering for 'needs-foster' dogs is not part of this search bar's current scope.
    }
</script>
    
<script>
    window.markerData = [{"id": "20065822", "lat": 45.0419073, "lon": -93.7891331, "name": "Snoop", "iconColor": "black", "details": "<h2>Snoop</h2><b>Status:</b> Intake<br><b>Sex:</b> Male<br><b>Age:</b> Adult <br><b>Energy:</b> High<br><b>City:</b> Delano<br><b>State:</b> MN<br><b>Days in Foster:</b> 1077.0<br><br><b>Description:</b><br>Snoop is a 3 year-old neutered purebred, male Doberman, who was surrendered to UDR from the breeder with his two sisters.&nbsp;Snoop tends to be on the shy and timid side but his spirit shines through despite the challenges he has faced.&nbsp;Snoop is very loving with his foster mom and dad&nbsp;and embodies the playful and adventurous essence of puppyhood.&nbsp;\r\n\r\nBeneath his lively exterior, Snoop reveals a vulnerability that only serves to deepen the connection with his caring companions. There are some men that do scare him so we can only venture at what his past may have experienced. Snoop will need a fully fenced yard as this boy can jump like a high stepping gazelle! Yes, Snoop can clear a 4-6 foot fence with ease.\r\n\r\nHe is dog friendly and loves doggy daycare! \r\n\r\nSnoop is fully vetted, vaccinated, heartworm negative, microchipped and neutered! If you have room in your heart for a courageous soul in need of a understanding home, Snoop is ready to make a lasting impression on your life and be your loyal companion.\r\n\r\nVisit our website at www.uniteddobermanrescue.org to submit your adoption application and welcome Snoop into your home.\r\n\r\nYour love and care will play a pivotal role in Snoop&#39;s ongoing journey toward ensuring that this resilient and lovable pup finds the perfect family to share his adventures and continue his healing.&nbsp;", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/20065/20065822/104175769.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/20065/20065822/104175770.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/20065/20065822/104174813.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/20065/20065822/104174814.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=20065822' target='_blank'><b>Public Website - Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Intake Report</a></div>"}, {"id": "21126202", "lat": 43.0386475, "lon": -87.9090751, "name": "Dragon", "iconColor": "black", "details": "<h2>Dragon</h2><b>Status:</b> Available<br><b>Sex:</b> Male<br><b>Age:</b> Adult <br><b>Energy:</b> High<br><b>City:</b> Milwaukee<br><b>State:</b> WI<br><b>Days in Foster:</b> 630.0<br><br><b>Description:</b><br>Meet Dragon, a handsome 3-year-old Doberman with a big playful heart!\r\nDragon is a really good boy who loves his people and thrives on affection and attention. He does great with people and dogs once he knows them, and he currently has other foster dog friends that he plays with on a regular basis but can be selective of others.\r\n\r\nDragon can just be weary of strangers at first, so he does best with slow introductions to new people and new animals to set him up for success. He is currently on Prozac to help him feel more settled and confident, and he is doing well on it.\r\n\r\nHe'll be happiest with an experienced handler who understands the breed, can read his cues, and can continue his routine. In return, you'll get a loyal, goofy, intelligent and affectionate best friend who loves toys, car rides, and an active lifestyle.\r\n\r\nDragon is housetrained, crate trained, and neutered. He needs a home with a fenced yard, no cats, and older/considerate kids only.\r\n\r\nIf you're looking for a fun, loving companion and can give him a little patience up front with new faces, Dragon might be your perfect match!", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/21126/21126202/102903659.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/21126/21126202/100085987.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/21126/21126202/100085986.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/21126/21126202/100299119.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=21126202' target='_blank'><b>Public Website - Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Intake Report</a></div>"}, {"id": "22176709", "lat": 44.919896, "lon": -92.9339449, "name": "Maggie Adoption Pending!", "iconColor": "black", "details": "<h2>Maggie Adoption Pending!</h2><b>Status:</b> Available<br><b>Sex:</b> Female<br><b>Age:</b> Adult <br><b>Energy:</b> High<br><b>City:</b> Woodbury<br><b>State:</b> MN<br><b>Days in Foster:</b> 203.0<br><br><b>Description:</b><br> MEET MAGGIE, THE BLUE BEAUTY WITH A BIG PERSONALITY! \r\n\r\n5-year-old blue purebred Doberman. Dog-friendly. Fabulous. Absolutely, positively NO CATS.\r\n\r\nThis stunning blue Doberman Pinscher has entered the building, and she would like everyone to know that she is fabulous. Maggie is beautiful, sweet, loyal, and equipped with just the right amount of Doberman sass. She has a big heart, a fun personality, and absolutely no intention of being a wallflower.\r\n\r\nThrough no fault of her own, changes in her family&#39;s circumstances meant Maggie lost the home she knew. Now this gorgeous girl is ready to turn the page and find the people who will make her next chapter her forever chapter.\r\n\r\nHer resume:\r\n\r\n\u2728 Blue and beautiful. Yes, she knows.\r\n\u2728 Sweet and loyal. Once you&#39;re her person, you&#39;re her person.\r\n\u2728 Sass level: just right. Not too much, not too little. Doberman standard.\r\n\u2728 Easy to get along with. A real people-pleaser, unless there&#39;s a snack involved, in which case she&#39;d like to discuss this development.\r\n\r\nAnd Maggie has exciting news... SHE LIKES DOGS! She loves having other dogs around and would be happy to share her humans, her toys, her adventures, and probably her opinions with a compatible four-legged roommate.\r\n\r\nNow, the kitty question. &nbsp; Maggie&#39;s answer is a firm no. Maggie has a high prey drive for little critters, and she is not a fan of cats. It&#39;s not personal, it&#39;s just who she is. Her forever home needs to be cat-free. No cats, no way, no exceptions, no &quot;but he&#39;s really friendly.&quot; Please don&#39;t ask. Maggie has made up her mind, and she&#39;s a Doberman, so she&#39;s not changing it.\r\n\r\nWhat Maggie wants in her people:\r\n\r\nThis girl is ready for FUN! She wants a family who will include her in life, give her stability and structure, and let her be the silly, loving, slightly sassy Doberman she was born to be.\r\n\r\nMaggie is not looking for a temporary pit stop. She is looking for HER PEOPLE. The kind of people who will say, &quot;Yes, Maggie, you may come with us.&quot;\r\n\r\n Going for a walk? Maggie&#39;s coming.\r\n Adventure? Maggie&#39;s coming.\r\n Road trip? Maggie is already in the car.\r\n\ufe0f Couch time? Obviously Maggie is coming.\r\n Someone has a snack? Maggie would like to discuss this development.\r\n\r\nShe is a loyal companion with an enormous heart, and once she knows you are her people, you can expect plenty of Doberman devotion.\r\n\r\nMaggie is fully ready to leave her past behind and get busy living her best life. She has beauty, brains, personality, and dog-friendliness. All she needs is the forever family who sees what a special girl she is.\r\n\r\nMaggie is blue. \r\nMaggie is beautiful.\r\nMaggie is dog-friendly.\r\nMaggie is NOT cat-friendly, and that&#39;s okay.\r\nMaggie has Doberman sass.\r\nMaggie has a giant heart.\r\nAnd Maggie is READY to be someone&#39;s best friend!\r\n\r\nThink your home might be Maggie&#39;s happily-ever-after? Apply to adopt this gorgeous girl today!\r\n\r\n United Doberman Rescue | www.uniteddobermanrescue.org", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22176/22176709/104121623.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22176/22176709/103666265.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22176/22176709/103930796.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22176/22176709/103666266.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22176709' target='_blank'><b>Public Website - Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Intake Report</a></div>"}, {"id": "22176710", "lat": 45.3038538, "lon": -93.5671825, "name": "Vinny", "iconColor": "black", "details": "<h2>Vinny</h2><b>Status:</b> Available<br><b>Sex:</b> Male<br><b>Age:</b> Adult <br><b>Energy:</b> High<br><b>City:</b> Elk River<br><b>State:</b> MN<br><b>Days in Foster:</b> 203.0<br><br><b>Description:</b><br>Meet purebred Doberman Vinny! Meet Vinny, a handsome 6-7 year-old black and rust purebred Doberman Pinscher! Vinny is a true gentleman who has been there, done that, and is ready to find a loving family to call his own.\r\n\r\nDue to changes in his family&rsquo;s circumstances, Vinny is looking for a fresh start and a new forever home.&nbsp;Through no fault of his own, he has lost the home he knew and is now ready for a new chapter with a family who will give him the love, patience, and stability he deserves.\r\n\r\nVinny is a loyal, devoted boy with a soft heart and plenty of personality. He&rsquo;s the kind of dog who forms deep connections with his people and loves being close to those he trusts. Whether he&rsquo;s relaxing by your side or soaking up some attention, Vinny is happiest when he&rsquo;s with his humans. Check him out playing with other dogs:&nbsp;https://www.facebook.com/reel/4482537615294038\r\n\r\nAfter everything he&rsquo;s been through, Vinny deserves a family who will show him just how wonderful life can be. If you&rsquo;re looking for a mature, loyal Doberman gentleman with a heart of gold, Vinny may be the perfect match for you!\r\n\r\nIf you&rsquo;re ready to give Vinny the forever home he deserves, apply today to adopt!\r\n\r\nwww.uniteddobermanrescue.org", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22176/22176710/103905000.jpg' style=  WI<br><b>Days in Foster:</b> 307.0<br><br><b>Description:</b><br>Meet Onyx &ndash; A One-of-a-Kind Doberman Looking for His Forever Home!\r\n\r\nAt just 1 year old, Onyx has already experienced more than his fair share of uncertainty, but this handsome boy is ready to put his past behind him and find the family he&#39;s been waiting for!\r\n\r\nOnyx&#39;s story began when he and his brother were found as strays while they were still puppies. Thankfully, both boys were given a second chance at life through rescue. His brother has since found his happily ever after, and now it&#39;s Onyx&#39;s turn to find a family to call his own!\r\n\r\nOne of the first things you&#39;ll notice about Onyx is his stunning appearance. He&#39;s a melanistic Doberman, meaning he has a genetic trait that causes an increased amount of dark pigmentation in his coat. This gives him his gorgeous, nearly solid-black appearance instead of the traditional black-and-rust markings most people associate with Dobermans. While his coloring may be uncommon, underneath that beautiful coat is a young Doberman with so much love and potential to offer!\r\n\r\nOnyx is dog friendly once he has had a chance to get to know his canine companions. Like many dogs, especially those who haven&#39;t had the benefit of consistent training and socialization from puppyhood, Onyx can display some leash and barrier reactivity. This means he may bark or become overly excited when he sees other dogs while restrained by a leash or separated by a fence or barrier. It&#39;s important to understand that leash reactivity doesn&#39;t automatically mean a dog is aggressive! Sometimes it&#39;s simply frustration, excitement, or uncertainty about how to handle a situation.\r\n\r\nOnyx would benefit from a family willing to continue working on his confidence, leash manners, and appropriate social skills through positive reinforcement training. With patience, consistency, and guidance, he has so much room to grow!\r\n\r\nAnd let&#39;s not forget, Onyx is still practically a puppy himself! At just a year old, he&#39;s young, moldable, full of life, and ready to learn. He&#39;s at a wonderful age to build a strong foundation with his future family, establish routines, and discover just how rewarding life as a beloved companion can be.\r\n\r\nOnyx doesn&#39;t need someone who expects perfection right away. He needs someone who sees his potential, understands that young dogs are still learning, and is excited to help him become the very best version of himself.\r\n\r\nHis brother already got his happy ending. Now it&#39;s time for Onyx to write the next chapter of his story.\r\n\r\nCould you be the family he&#39;s been waiting for?\r\n\r\nApply to adopt Onyx through United Doberman Rescue &amp; Canine Castaways!\r\n\r\nhttps://www.uniteddobermanrescue.org/", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22205/22205987/104054557.png' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22205/22205987/104124591.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22205/22205987/104124590.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22205/22205987/103885222.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22205987' target='_blank'><b>Public Website - Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Intake Report</a></div>"}, {"id": "22399870", "lat": 31.685279, "lon": -111.0621284, "name": "Tootsie", "iconColor": "black", "details": "<h2>Tootsie</h2><b>Status:</b> Available<br><b>Sex:</b> Female<br><b>Age:</b> Young <br><b>Energy:</b> High<br><b>City:</b> Amado<br><b>State:</b> AZ<br><b>Days in Foster:</b> 220.0<br><br><b>Description:</b><br>Meet Tootsie! Tootsie is a stunning cropped and docked purebred Doberman girl, somewhere between 1 and 3 years young. Her birth certificate is missing, so we&#39;re calling her &quot;forever young.&quot;\r\n\r\nHer early chapters were rough. She survived on the streets of Los Angeles, was picked up by the dog catcher, and then spent over two months in a loud LA shelter where the barking never stopped. For a sensitive Doberman, that was a lot. But she made it, and now she gets to find out what a good life feels like. And she is blossoming! In foster care, Tootsie has picked her one person: her foster mom. Where mom goes, Tootsie follows, and she keeps one eye on her at all times. Trust is a brave thing to learn, and every little step forward is a win for Tootsie. Tootsie is great with the resident cats, dogs and even horses!\r\n\r\nA few fun facts about Tootsie:\r\n\r\n\r\nShe loves her crate. It&#39;s her cozy little studio apartment, and sometimes she needs a gentle &quot;hey, come join the party&quot; to venture out. We think that&#39;s perfectly reasonable, because who doesn&#39;t love a good safe space?\r\nShe is fully potty trained. Star student!\r\nShe is fully vetted and spayed.\r\nHer best pal was a tiny Yorkie. Yes, shes great with little dogs and even cats! It is adorable.\r\nLoud surprises like car horns, sirens, and bangs make her world spin, so calm and cozy is her love language. She will need a home that understands fear responses in dogs and can work with building trust.\r\n\r\n\r\nTootsie&#39;s dream home has:\r\n\r\n\r\nA high, secure fenced yard, because this girl is a serious flight risk and could probably star in her own escape movie.\r\nA GPS collar for extra peace of mind. She will come with one from the rescue. She is also microchipped:)\r\nA friendly canine buddy to be her forever pal and guide, because Tootsie is a dog&#39;s dog and a home with other dogs is a must.\r\nLots of patience and love for her healing and bonding journey.\r\n\r\n\r\nWe aren&#39;t giving up on this girl, and one day she will have a family to call her own. Could it be you? A family with expereince with this breed preferred, fenced yard and other canines for doggy support. Yes Tootsie will benefit from having her own personal support animal:)\r\n\r\nPlease read our adoption policy, and if you qualify, apply at www.uniteddobermanrescue.org&nbsp;", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22399/22399870/104121616.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22399/22399870/104121617.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22399/22399870/104092139.png' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22399/22399870/104024690.png' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22399870' target='_blank'><b>Public Website - Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Intake Report</a></div>"}, {"id": "22758708", "lat": 43.0386475, "lon": -87.9090751, "name": "Penny Adoption Pending!", "iconColor": "red", "details": "<h2>Penny Adoption Pending!</h2><b>Status:</b> Available<br><b>Sex:</b> Female<br><b>Age:</b> Young <br><b>Energy:</b> Moderate<br><b>City:</b> Milwaukee<br><b>State:</b> WI<br><b>Days in Foster:</b> 76.0<br><br><b>Description:</b><br>Meet Penny!\r\n\r\nPenny is a sweet young girl who we estimate to be around 6 months old, and she has already been through more than any puppy should have to endure. Penny came to us from Animal Control in Wisconsin after suffering a severe broken leg. Despite everything she has been through, this little girl continues to show us just how resilient and loving she is.\r\n\r\nPenny&rsquo;s leg may ultimately need to be amputated, but because she is still so young, we are confident that she will adapt incredibly well if that ends up being the best option for her. We will be working closely with our veterinary team and following their recommendations to make sure Penny receives whatever care is truly in her best interest.\r\n\r\nRight now, Penny is focused on being a puppy &mdash; learning, growing, and soaking up all the love she deserves. She is looking for a family who understands that she may have some extra medical needs along the way, but who also sees what we see: a bright, beautiful little girl with so much life ahead of her.\r\n\r\nPenny has already overcome so much in her short life, and we cannot wait to see what her future holds. She deserves a family who will give her patience, love, and the chance to show everyone just how special she is.\r\n\r\nPenny may have had a rough start, but we know her best days are still ahead.", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22758/22758708/104124586.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22758/22758708/104124587.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22758/22758708/104036447.png' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22758/22758708/103885219.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22758708' target='_blank'><b>Public Website - Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Intake Report</a></div>"}, {"id": "22822311", "lat": 44.9101545, "lon": -93.0802073, "name": "Klaus", "iconColor": "red", "details": "<h2>Klaus</h2><b>Status:</b> Available<br><b>Sex:</b> Male<br><b>Age:</b> Adult <br><b>Energy:</b> Moderate<br><b>City:</b> West St Paul<br><b>State:</b> MN<br><b>Days in Foster:</b> 49.0<br><br><b>Description:</b><br>Meet Klaus! Handsome doesn&#39;t begin to cover it. This sweet, approximately 3&frac12;-year-old neutered Doberman is a gentle soul with a heart as big as his ears are perky, and he&#39;s ready to find the family he&#39;s been dreaming about.\r\n\r\nKlaus loves people of all ages, and he&#39;s a total pro with kids. He even has a 4-year-old human buddy who thinks he hung the moon. He&#39;s equally smooth with other dogs, getting along with both boys and girls, though he&#39;d really love a female canine companion to share the couch with. Fair warning: Klaus is not a fan of cats, so his forever home needs to be cat-free.\r\n\r\nKlaus is a smart cookie, too. He knows his basic commands and has an excellent recall, so when you call, he comes running (probably with a goofy grin). He&#39;s never possessive of his food or toys, and he is affectionate to the core, the kind of dog who will happily lean into you for one more cuddle.\r\n\r\nHe&#39;s up to date on his vaccinations and is currently being treated for allergies. Like any good student, Klaus has one subject he&#39;s still working on: leash walking. With a little patience, structure, and continued training, he&#39;ll be strutting down the sidewalk like a champ.\r\n\r\nKlaus has so much love to give. All he needs is a family who will offer patience, guidance, and most of all, a permanent place to call home. Could that be you?\r\n\r\nLearn more about adopting Klaus at https://www.uniteddobermanrescue.org/", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22822/22822311/104148121.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22822/22822311/104121621.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22822/22822311/104002605.png' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22822/22822311/104148120.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22822311' target='_blank'><b>Public Website - Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Intake Report</a></div>"}, {"id": "22823132", "lat": 42.7313756, "lon": -87.7834769, "name": "Brandy", "iconColor": "red", "details": "<h2>Brandy</h2><b>Status:</b> Available<br><b>Sex:</b> Female<br><b>Age:</b> Adult <br><b>Energy:</b> Moderate<br><b>City:</b> Racine<br><b>State:</b> WI<br><b>Days in Foster:</b> 49.0<br><br><b>Description:</b><br>Meet Brandy, a stunning 5-year-old, CAT friendly, AKC red Doberman beauty who is every bit as sweet as she is beautiful!\r\n\r\nBrandy has spent nearly her entire life devoted to one person. Since she was just 10 weeks old, she lived with her elderly human as his companion, and in true Doberman fashion, she took that job very seriously. Unfortunately, her owner recently had to move into assisted living, and his family made the difficult decision to find Brandy a new home where she can receive all the love, attention, and companionship she deserves.\r\n\r\nBrandy is a typical Dobe when it comes to her home and her person. She bonds closely with her human and will absolutely let strangers know she is there when they enter her territory. Once she knows you, though, you&#39;ll quickly see the sweet girl behind that beautiful red exterior.\r\n\r\nBrandy has done well with the other dogs in her home. Any introductions to dogs or other pets should be done slowly, correctly, and with plenty of time for everyone to become comfortable.\r\n\r\nBrandy has spent the last five years being someone&#39;s loyal companion, and now she&#39;s looking for someone who will be hers. She deserves a home that understands the devotion, intelligence, and protective nature that comes with loving a Doberman&mdash;and, most importantly, a family ready to make her part of their world again.\r\n\r\nThis red beauty has so much love and loyalty left to give. Could Brandy be your girl?", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22823/22823132/104069474.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22823/22823132/104097400.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22823/22823132/103932681.png' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22823/22823132/103932682.png' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22823132' target='_blank'><b>Public Website - Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Intake Report</a></div>"}, {"id": "22845325", "lat": 43.4313466, "lon": -96.6985231, "name": "Scooby", "iconColor": "red", "details": "<h2>Scooby</h2><b>Status:</b> Available<br><b>Sex:</b> Male<br><b>Age:</b> Adult <br><b>Energy:</b> Moderate<br><b>City:</b> Harrisburg<br><b>State:</b> SD<br><b>Days in Foster:</b> 37.0<br><br><b>Description:</b><br>Scooby was saved with just HOURS LEFT after landing on the euthanasia list. This handsome boy was running out of time, but someone saw that his life was worth saving. Now, we get to show the world what an incredible dog he truly is. And honestly? Scooby might just be the whole package. This boy is potty trained, knows how to listen, follows directions, and is eager to learn. He&rsquo;s treat-motivated and can pick up new commands in just 2&ndash;3 repetitions when treats are involved. He walks beautifully off leash with his person and enjoys getting out for adventures, including hikes. Scooby gets along with other dogs when given slow, proper introductions. He&rsquo;s also living proof that a big dog doesn&rsquo;t have to make a big fuss about everything. He ignores his foster&rsquo;s chickens and remains calm around other animals, even when other dogs are barking. When something catches his attention on a hike, he&rsquo;ll stop and observe until he&rsquo;s satisfied there&rsquo;s no threat rather than immediately reacting. Inside the home? He&rsquo;s a dream. Scooby isn&rsquo;t destructive, enjoys a good chew stick, and simply wants to be near his person. But here&rsquo;s where this big guy will steal your heart&hellip; Scooby is a certified LOVE BUG. He wants to be petted on his nose and head all day, every day. He&rsquo;s happiest just being close to his human, soaking up affection and reminding you that sometimes the best part of life is having a loyal companion by your side. Think about it. A dog who listens, learns quickly, enjoys adventures, can coexist peacefully with other animals, knows his manners, and wants nothing more than to love his people. This is the dog who was almost out of time. Scooby deserved more than the final hours he was given. He deserved a chance to be someone&#39;s best friend, hiking buddy, couch companion, and forever shadow. Now he needs someone to give him the one thing rescue cannot promise forever: a home of his own. Could that be you? If you&#39;re looking for a wonderful companion to welcome into your life, please consider Scooby. He has so much love to give, and his next chapter deserves to be filled with safety, adventures, affection, and the promise that he will never have to wonder if his time is running out again. Scooby is ready for his happily ever after. Let&#39;s make sure this boy&#39;s story ends with a family of his own. Fostered in California Apply to adopt Scooby through United Doberman Rescue &amp; Canine Castaways: https://www.uniteddobermanrescue.org/", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22845/22845325/104067034.png' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22845/22845325/104067039.png' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22845/22845325/103983100.png' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22845/22845325/103977485.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22845325' target='_blank'><b>Public Website - Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Intake Report</a></div>"}, {"id": "22868917", "lat": 44.847917, "lon": -92.9980516, "name": "River", "iconColor": "lightred", "details": "<h2>River</h2><b>Status:</b> Available<br><b>Sex:</b> Male<br><b>Age:</b> Adult <br><b>Energy:</b> Low<br><b>City:</b> St Paul Park<br><b>State:</b> MN<br><b>Days in Foster:</b> 19.0<br><br><b>Description:</b><br>\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nMeet River, a 5 year old Dane X. River is a gentle giant with a heart as big as he is. This cat-loving Great Dane mix has white twinkle toes and a lover&#39;s soul through and through, and he would love to cuddle with a cat on a cold winter&#39;s night! He loves going to doggy daycare and meeting people, and he is the best boy and an easy keeper. Basically, if you wanted a dog who thinks everyone is his new best friend, congratulations, you found him.\r\n\r\nRiver is being fostered in Minnesota. He came to us from Louisiana, where there are far too many dogs and very few humans who care. The dogs there are just trying to survive each day, with only the rescuers to look out for them. River has been waiting in rescue for his forever home for far too long &mdash; well over a year &mdash; because he was too ordinary in Louisiana. We think he&#39;s spectacular and just a gem, and he is exactly the kind of dog UDR strives to help.\r\n\r\nRiver is currently fostered in a home with other Danes. His foster tells us he is dog friendly, loves going to doggy daycare, likes playing with the resident cat, rides well in the car, is totally crate trained, house trained, and loves meeting kids of all ages.\r\n\r\nNow, the fine print: he does not like squirrels. At all. He has strong opinions about squirrels and would like to discuss them at length, preferably while chasing them. He is also still working out the whole &quot;leash and walk at the same time&quot; concept, a work in progress! River&nbsp;believes anything left on the counter was clearly put there for him. He has agreed to work on this with his foster mom!&nbsp;A high, sturdy fence is a must, unless you want him visiting the neighbors to continue the squirrel negotiations. Can&#39;t be perfect, but he&#39;s working on it and perfection is his goal. River tries so hard every day to be the best-est boy, but the temptations of food on the counter and squirrels are just to much some days. We all get it. But hey your yard will be clear of those pesky&nbsp;varmints and your counters will be spotless! River has spent his life far too long waiting and we know moving him to our rescue was the right thing for him. Let&#39;s find him a forever home. He is so deserving!!!! Yes he has a couple enduring quirks, but who doesnt?\r\n\r\nIf you adopt River, you will probably say you don&#39;t understand why he wasn&#39;t scooped up by another family. And you will be so thankful it was you. Interested in meeting River? He is being fostered in the Twin Cities metro, MN. www.uniteddobermanrescue.org\r\n\r\n\r\n\r\n&nbsp;\r\n\r\n\r\n\r\n\r\n\r\n\r\n", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22868/22868917/104121622.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22868/22868917/104066921.png' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22868/22868917/104066923.png' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22868/22868917/104066925.png' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22868917' target='_blank'><b>Public Website - Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Intake Report</a></div>"}, {"id": "22880159", "lat": 45.3038538, "lon": -93.5671825, "name": "Ayzal", "iconColor": "lightred", "details": "<h2>Ayzal</h2><b>Status:</b> Available<br><b>Sex:</b> Female<br><b>Age:</b> Adult <br><b>Energy:</b> High<br><b>City:</b> Elk River<br><b>State:</b> MN<br><b>Days in Foster:</b> 21.0<br><br><b>Description:</b><br>Meet 1 year old F Doberman, Ayzal, like Hazel without the H&mdash; Currently in a foster to adopt home! Your Smart, Sweet New Best Friend! At just 1.5 years old, Azo is ready to find the forever family she&#39;s been waiting for! This sweet girl has so much love to give and absolutely enjoys being around people. Whether she&#39;s meeting new friends or soaking up attention, Azo has a wonderful personality that makes her easy to fall in love with. Azo is also one smart cookie! She has completed private one-on-one training sessions and has learned her basic commands. She&#39;s a bright girl who can learn quickly, and continuing her training will be a great way to build her confidence, strengthen your bond, and help her keep reaching her full potential. Azo has also shown that she can handle large crowds. &nbsp;This girl has the brains, the sweetness, and the potential to make an incredible companion. She&#39;s still young, still learning, and ready for someone who will invest in her and give her the life she deserves. Could Azo be the missing piece of your family? She&#39;s ready to trade training sessions for a lifetime of love, adventures, and a place to finally call home. Ayzal is in a foster to adopt home.&nbsp;", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22880/22880159/104059688.png' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22880/22880159/104059689.png' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22880/22880159/104059690.png' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22880/22880159/104059691.png' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22880159' target='_blank'><b>Public Website - Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Intake Report</a></div>"}, {"id": "22894067", "lat": 43.5981718, "lon": -88.2849664, "name": "Dixie Adoption pending!", "iconColor": "lightred", "details": "<h2>Dixie Adoption pending!</h2><b>Status:</b> Available<br><b>Sex:</b> Female<br><b>Age:</b> Young <br><b>Energy:</b> High<br><b>City:</b> Campbellsport<br><b>State:</b> WI<br><b>Days in Foster:</b> 9.0<br><br><b>Description:</b><br>MEET DIXIE: 2 YEARS OLD, ALL NATURAL, AND A FULL-TIME PROFESSIONAL SNUGGLER! Looking for a gorgeous Doberman girl who will love you unconditionally, follow you everywhere, and occasionally question your judgment when you ask her to go outside in the rain? Well, meet Dixie! Dixie is a beautiful 2-year-old, all-natural Doberman sweetheart with a whole lot of love to give and a personality that will keep you smiling! Let&#39;s talk about what makes Dixie so special! Dog friendly? Absolutely! Dixie enjoys her canine companions and would love having some four-legged friends around! Snuggle bug? That&#39;s practically her full-time job! Dixie is all about the cuddles, affection, and being as close to her humans as physically possible. Personal space is simply not in her vocabulary. If you wanted a dog who respects boundaries, you might want to keep scrolling! Sensitive Doberman princess? Oh, 100%. Dixie has that classic Doberman sensitivity, especially when it comes to the WEATHER. Rain? Hard pass. Wet paws? Absolutely unacceptable. Being asked to go potty when water is literally FALLING FROM THE SKY? The audacity. Dixie would much rather be curled up somewhere warm and cozy, preferably under a blanket with her favorite human. And honestly, can we blame her? At just 2 years old, Dixie has so much life, love, and adventure ahead of her! She&#39;s looking for a family who will appreciate her sweet personality, embrace her Velcro Doberman tendencies, and understand that sometimes a princess simply does not wish to get her paws wet. If your dream dog is a beautiful, dog-friendly, affectionate Doberman who doubles as a personal space heater and professional cuddle companion, Dixie might just be your girl! Apply to adopt Dixie through United Doberman Rescue &amp; Canine Castaways of MN! https://www.uniteddobermanrescue.org/", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22894/22894067/104124302.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22894/22894067/104124303.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22894/22894067/104124320.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22894/22894067/104094129.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22894067' target='_blank'><b>Public Website - Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Intake Report</a></div>"}, {"id": "22894646", "lat": 44.9032963, "lon": -93.5663455, "name": "Toby", "iconColor": "lightred", "details": "<h2>Toby</h2><b>Status:</b> Available<br><b>Sex:</b> Male<br><b>Age:</b> Senior <br><b>Energy:</b> Low<br><b>City:</b> Excelsior<br><b>State:</b> MN<br><b>Days in Foster:</b> 12.0<br><br><b>Description:</b><br>8 YEARS OF LOVE, ONE BROKEN HEART, AND A WHOLE LOT OF BEAGLE LEFT TO GIVE. MEET TOBY!\r\n\r\nToby wasn&#39;t supposed to be looking for a new family at 8 years old.\r\n\r\nThis sweet Beagle boy had a home. He had a person. He had a life he knew and loved. But sadly, when his beloved owner passed away, Toby&#39;s entire world changed overnight.\r\n\r\nNow, at 8 years young, Toby is searching for someone to love him through the next chapter of his life.\r\n\r\nAnd trust us, this handsome little guy has SO much love left to give!\r\n\r\nA LITTLE ABOUT TOBY!\r\n\r\nAge: 8 years young, with plenty of Beagle charm!\r\n\r\nDog friendly: Yes! Toby gets along with other dogs and would be happy to have canine companions!\r\n\r\nCat friendly: Absolutely! This sweet boy is good with feline friends, too!\r\n\r\nPersonality: Toby is an incredibly sweet boy who is understandably feeling a little confused and anxious right now. After losing his person and everything familiar, who could blame him? He just needs a patient, loving family to help him feel safe and secure again.\r\n\r\nFitness goals: Let&#39;s just say Toby has been enjoying the good life a LITTLE too much. He&#39;s currently sporting some extra Beagle fluff and will need a family committed to helping him shed a few pounds at a safe, healthy pace.\r\n\r\nThink leisurely walks, appropriate portions, and a whole lot of encouragement. Toby is officially entering his fitness era!\r\n\r\nBut here&#39;s the thing about Toby.\r\n\r\nHe doesn&#39;t know he&#39;s considered a senior.\r\n\r\nHe doesn&#39;t know he&#39;s carrying a few extra pounds.\r\n\r\nAnd he certainly doesn&#39;t understand why the person he loved isn&#39;t coming home.\r\n\r\nAll he knows is that his world has changed, and he&#39;s waiting for someone to make it feel right again.\r\n\r\nToby doesn&#39;t need a perfect family. He just needs a family who will love him.\r\n\r\nSomeone who understands that adjusting takes time. Someone who will celebrate the little victories as his confidence returns. Someone who will give him the security of knowing he&#39;s finally home again.\r\n\r\nAt 8 years old, Toby deserves more than uncertainty. He deserves cozy beds, sniff-filled walks, gentle affection, and a family who will cherish every single day with him.\r\n\r\nHis first chapter was filled with love. Let&#39;s make sure his next chapter is, too.\r\n\r\nInterested in making Toby part of your family? Apply to adopt through United Doberman Rescue &amp; Canine Castaways of MN!\r\n\r\nhttps://www.uniteddobermanrescue.org/", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22894/22894646/104148147.png' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22894/22894646/104146049.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22894/22894646/104146054.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22894/22894646/104153809.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22894646' target='_blank'><b>Public Website - Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Intake Report</a></div>"}, {"id": "22898711", "lat": 44.9667546, "lon": -92.3732461, "name": "Tingles-Coming soon!", "iconColor": "lightred", "details": "<h2>Tingles-Coming soon!</h2><b>Status:</b> Available<br><b>Sex:</b> Female<br><b>Age:</b> nan <br><b>Energy:</b> Moderate<br><b>City:</b> Baldwin<br><b>State:</b> WI<br><b>Days in Foster:</b> -14.0<br><br><b>Description:</b><br>Meet Tingles, a beautiful 2-year-old Dobeweiler, or Rotterman if you prefer, with a heart of gold and an incredible story of resilience! She came into rescue after reportedly being hit by a car, and when she first arrived at the shelter, she was unable to stand or walk on her own.\r\n\r\nA closer look on November 9th found a complete fracture of her ischium, the lower part of her pelvis, already mending, plus a suspected sacroiliac luxation where her pelvis meets her spine. No surgery is needed \u2014 she is on 6 to 8 weeks of strict cage rest, with medication to keep her comfortable, and her prognosis is good. A stitched wound on the inside of her leg is closing nicely.\r\n\r\nShe has come so far, from being unable to get herself up to walking outside to go potty on her own. She is still a little wobbly, especially on slick floors, but she keeps improving. In her foster home in Texas, she is doing great \u2014 very sweet, loves her toys, and pretty chill. She settles in her kennel after a few minutes and sleeps all night, and she even took her cone off today! Outside she wants to run, so she needs a slow, short leash pace for now.\r\n\r\nWhat makes Tingles truly special is her personality. She is an absolute sweetheart who loves people, happily wags her tail at everyone she meets, and is always ready to soak up love, attention, and kisses. UDR stepped in and tagged this special girl, and she is now safe in foster care. She is looking for a patient family who understands her recovery will take time and will give her a safe, loving home while she finishes getting stronger. We are still learning what her long-term needs will be, but one thing is already clear: Tingles has so much love to give! Could you be the family to give her a second chance? Learn more about adopting through United Doberman Rescue & Canine Castaways at: www.uniteddobermanrescue.org", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22898/22898711/104103125.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22898/22898711/104103126.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22898/22898711/104103127.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22898/22898711/104103128.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22898711' target='_blank'><b>Public Website - Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>Rescu ining weight, receiving ongoing veterinary care, and feeling better every day.\r\nA little about Asher:\r\nBreed: Mastiff/Great Dane mix\r\nGender: Male (will be neutered before adoption)\r\nAge: Unknown, but believed to be a younger adult\r\nPersonality: Active, playful, resilient, and full of life!\r\nSize: Extra-large, with an even bigger heart!\r\nAsher is proof that even after a rough start, dogs can have an incredible zest for life. He's an active boy who would love a family that appreciates giant breeds and understands that big dogs need exercise, structure, training, and plenty of love!\r\nWhile Asher continues his journey toward a healthy weight, he's looking forward to finding the people who will love him for the rest of his life.\r\nAsher's future family should be prepared for all the wonderful things that come with owning a giant breed, from those oversized paws and goofy personalities to the extra space they take up on the couch!\r\nAsher's past may be heartbreaking, but his future doesn't have to be.\r\nCould you be the happy ending this big guy deserves?\r\nApply to adopt or learn more about Asher through United Doberman Rescue & Canine Castaways!\r\nhttps://www.uniteddobermanrescue.org", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22931/22931651/104180142.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22931/22931651/104180143.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22931651' target='_blank'><b>Foster Dog's Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_bl     window.updateSidebar = function(data) {
        if (!data) return;

        document.getElementById('videos').innerHTML = data.videos || '';
        document.getElementById('info-text').innerHTML = data.details || '';
        document.getElementById('links').innerHTML = data.links || '';
        document.getElementById('sidebar').classList.add('open');

        var tabs = document.getElementsByClassName("tab-content");
        var buttons = document.getElementsByClassName("tab-btn");
        for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.remove("active");
            buttons[i].classList.remove("active");
        }
        document.getElementById('details').classList.add('active');
        buttons[0].classList.add("active");
    };

<script>
function applyPrimaryKeySync() {
    console.log("Searching for Map and Cluster objects...");

    var foundMap = null;
    var foundCluster = null;

    // Search global scope for Leaflet objects
    for (var key in window) {
        if (window[key] instanceof L.Map) {
            foundMap = window[key];
        }
        if (window[key] instanceof L.MarkerClusterGroup) {
            foundCluster = window[key];
        }
    }

    if (foundMap && foundCluster && foundCluster._featureGroup) {
        console.log("Map and Cluster found. Binding clicks...");
        foundCluster.eachLayer(function(marker) {
            if (marker instanceof L.Marker && marker.options.animalId) {
                marker.off('click');
                marker.on('click', function(e) {
                    var dogId = e.target.options.animalId;
                    var data = window.markerData.find(d => String(d.id) === String(dogId));
                    if (data) window.updateSidebar(data);
                });
            }
        });
        console.log("Sync engine active.");
    } else {
        console.log("Still waiting for Leaflet objects... retrying");
        setTimeout(applyPrimaryKeySync, 1000);
    }
}
setTimeout(applyPrimaryKeySync, 1500);
