Description:</b><br>Meet _______!\r\nThis handsome little guy is a Doberman Pinscher/Bernese Mountain Dog mix, which means he's got two incredible breeds packed into one adorable puppy!\r\nWith a Doberman parent and a Bernese Mountain Dog parent, _______ has the potential to grow into one big, loyal, loving companion!\r\nA little about his breeds:\r\nDobermans are known for their intelligence, loyalty, athleticism, and strong bonds with their families. They're incredibly smart dogs who love having a job to do and thrive with consistent training, mental stimulation, and plenty of interaction with their people.\r\nBernese Mountain Dogs are often known as gentle giants! They're typically affectionate, devoted, and eager to be part of the family. They are also a large working breed that enjoys spending time with their favorite humans.\r\nWhat does that mean for _______?\r\nHe could grow up to be a wonderful combination of brains, beauty, goofiness, and affection! Both breeds are known for forming strong bonds with their families, so we're hoping this little guy finds someone ready to make him a lifelong part of theirs.\r\nAs a mix of two large breeds, he's expected to be a big boy when fully grown! His future family should be prepared for all the fun (and challenges!) that come with raising a large-breed puppy.\r\nLike any puppy, _______ will need patience, positive reinforcement training, socialization, and guidance as he learns how to become the best boy he can be. His individual personality will continue to develop as he grows!\r\nLooking for a loyal companion, future adventure buddy, and oversized cuddle partner? _______ might just be your perfect match!\r\nApply to adopt through United Doberman Rescue & Canine Castaways of Minnesota!\r\nhttps://www.uniteddobermanrescue.org/", "photos": "", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22931641' target='_blank'><b>Foster Dog's Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Available Dogs Report</a><br><br><a href='https://rescuegroups.org/manage/animals_intakes#datatable387={%22limit%22:%2225%22,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:%22%22,%22sortorder%22:%22asc%22,%22viewID%22:%22211%22,%22viewType%22:%22Built-in%22,%22searchEnabled%22:false}&' target='_blank' style='color:#999;'>RescueGroups - Intake Report</a></div>"}, {"details": "<h2>Asher</h2><b>Status:</b> Intake<br><b>Sex:</b> Male<br><b>Description:</b><br>Meet Asher \u2014 A Gentle Giant With a Second Chance at Life!\r\nIf you love BIG dogs with even BIGGER personalities, Asher might just be your perfect match!\r\nAsher is a handsome Mastiff/Great Dane mix with a story that will tug at your heartstrings. This sweet boy was found on the side of the road, approximately 25\u201330 pounds underweight. Despite everything he's been through, Asher hasn't lost his playful spirit or his love for life!\r\nThankfully, Asher is now getting the care he deserves! He's steadily gaining weight, receiving ongoing veterinary care, and feeling better every day.\r\nA little about Asher:\r\nBreed: Mastiff/Great Dane mix\r\nGender: Male (will be neutered before adoption)\r\nAge: Unknown, but believed to be a younger adult\r\nPersonality: Active, playful, resilient, and full of life!\r\nSize: Extra-large, with an even bigger heart!\r\nAsher is proof that even after a rough start, dogs can have an incredible zest for life. He's an active boy who would love a family that appreciates giant breeds and understands that big dogs need exercise, structure, training, and plenty of love!\r\nWhile Asher continues his journey toward a healthy weight, he's looking forward to finding the people who will love him for the rest of his life.\r\nAsher's future family should be prepared for all the wonderful things that come with owning a giant breed, from those oversized paws and goofy personalities to the extra space they take up on the couch!\r\nAsher's past may be heartbreaking, but his future doesn't have to be.\r\nCould you be the happy ending this big guy deserves?\r\nApply to adopt or learn more about Asher through United Doberman Rescue & Canine Castaways!\r\nhttps://www.uniteddobermanrescue.org", "photos": "<img src='https://cdn.rescuegroups.org/8319/pictures/animals/22931/22931651/104180142.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' /><img src='https://cdn.rescuegroups.org/8319/pictures/animals/22931/22931651/104180143.jpg' style='width:100%; margin-bottom:10px; border-radius:5px;' />", "videos": "", "links": "<a href='https://www.uniteddobermanrescue.org/animals/detail?AnimalID=22931651' target='_blank'><b>Foster Dog's Full Profile</b></a><br><br><a href='https://www.facebook.com/UnitedDobermanRescue' target='_blank'>Facebook - United Doberman Rescue</a><br><br><a href='https://www.instagram.com/uniteddobermanrescue' target='_blank'>Instagram - uniteddobermanrescue</a><br><br><a href='https://www.youtube.com/@mooseonaloose1' target='_blank'>YouTube - United Doberman Rescue and CC of MN</a><div style='margin-top:60px;'><a href='https://rescuegroups.org/manage/animals#datatable74={%22limit%22:25,%22page%22:1,%22start%22:0,%22sortbyFieldID%22:1499,%22sortorder%22:%22asc%22,%22viewID%22:%22112%22,%22viewType%22:%22Built-in%22,%22togglethumbnails%22:%22Off%22,%22search         document.getElementById('info-text').innerHTML = data.details || '';

        var buttons = document.getElementsByClassName("tab-btn");
        for (var i = 0; i < tabs.length; i++) {

        }

        buttons[0].classList.add("active");
    };

<script>
function applyPrimaryKeySync() {
    console.log("Searching for Map and Cluster objects...");

    var foundMap = null;
    var foundCluster = null;

    // Search global scope for Leaflet objects
    for (var key in window) {
        if (window[key] instanceof L.Map) {
            foundMap = window[key];
        }
        if (window[key] instanceof L.MarkerClusterGroup) {
            foundCluster = window[key];
        }
    }

    if (foundMap && foundCluster && foundCluster._featureGroup) {
        console.log("Map and Cluster found. Binding clicks...");
        foundCluster.eachLayer(function(marker) {
            if (marker instanceof L.Marker && marker.options.animalId) {
                marker.off('click');
                marker.on('click', function(e) {
                    var dogId = e.target.options.animalId;
                    var data = window.markerData.find(d => String(d.id) === String(dogId));
                    if (data) window.updateSidebar(data);
                });
            }
        });
        console.log("Sync engine active.");
    } else {
        console.log("Still waiting for Leaflet objects... retrying");
        setTimeout(applyPrimaryKeySync, 1000);
    }
}
setTimeout(applyPrimaryKeySync, 1500);
</script>
