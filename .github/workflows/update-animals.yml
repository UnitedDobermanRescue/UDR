name: Update foster animals CSV

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest animals and update CSV
        env:
          RESCUEGROUPS_API_KEY: ${{ secrets.RESCUEGROUPS_API_KEY }}
          RESCUEGROUPS_USERNAME: ${{ secrets.RESCUEGROUPS_USERNAME }}
          RESCUEGROUPS_PASSWORD: ${{ secrets.RESCUEGROUPS_PASSWORD }}
          RESCUEGROUPS_ACCOUNT: ${{ secrets.RESCUEGROUPS_ACCOUNT }}
        run: python update_animals_csv.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add animals.csv
          git diff --quiet --cached || git commit -m "Auto-update foster animals data"
          git push
