name: Build notebooks to HTML

on:
  push:
    paths:
      - '**/*.ipynb'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert jupyter nbformat

      - name: Convert notebooks to HTML
        run: |
          mkdir -p docs
          for nb in $(git ls-files '*.ipynb'); do
            base=$(basename "$nb" .ipynb)
            echo "Converting $nb -> docs/${base}.html"
            jupyter nbconvert --to html "$nb" --output-dir docs --output "$base" || true
          done

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: build notebooks → HTML"
            git push
          fi
