name: Build notebooks to HTML

on:
  push:
    paths:
      - '**/*.ipynb'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert jupyter nbformat

      - name: Convert notebooks to HTML
        run: |
          mkdir -p docs
          # convert every tracked notebook in the repo to HTML into docs/
          for nb in $(git ls-files '*.ipynb'); do
            base=$(basename "$nb" .ipynb)
            echo "Converting $nb -> docs/${base}.html"
            jupyter nbconvert --to html "$nb" --output-dir docs --output "$base" || true
          done

      - name: Commit generated HTML
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "ci: build notebooks → HTML"
          commit_user_name: github-actions
          commit_user_email: github-actions@github.com
          file_pattern: "docs/**"
