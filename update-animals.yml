name: Update foster animals CSV and map

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas folium geopy

      - name: Fetch latest animals from RescueGroups
        env:
          RESCUEGROUPS_API_KEY: ${{ secrets.RESCUEGROUPS_API_KEY }}
          RESCUEGROUPS_USERNAME: ${{ secrets.RESCUEGROUPS_USERNAME }}
          RESCUEGROUPS_PASSWORD: ${{ secrets.RESCUEGROUPS_PASSWORD }}
          RESCUEGROUPS_ACCOUNT: ${{ secrets.RESCUEGROUPS_ACCOUNT }}
        run: python update_animals_csv.py

      - name: Did the data change?
        id: changed
        run: |
          if git diff --quiet animals.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the map
        if: steps.changed.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python build_map.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add animals.csv geocode_cache.json foster_map_final.html
          git diff --quiet --cached || git commit -m "Auto-update foster animals data and map"
          git push
