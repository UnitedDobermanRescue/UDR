name: Update foster animals CSV
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest animals and update CSV
        env:
          RG_API_KEY: ${{ secrets.RG_API_KEY }}
          RG_USER: ${{ secrets.RG_USER }}
          RG_PASS: ${{ secrets.RG_PASS }}
          RG_ACCOUNT: ${{ secrets.RG_ACCOUNT }}
        run: python update_animals_csv.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add animals.csv
          git diff --quiet --cached || git commit -m "Auto-update foster animals data"
          git push
